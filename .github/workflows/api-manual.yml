name: E2E Tests
run-name: E2E Tests · ${{ github.event_name == 'schedule' && 'all' || (inputs.tags || 'smoke') }}

on:
  schedule:
    - cron: '0 3 * * *' # Run at 03:00 UTC every day (nightly)
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tags:
        type: string
        description: Tags for test scope(s) (smoke, accounts, policies, all, ...)
        default: "smoke"
      sr_balance:
        type: number
        description: INITIAL_STANDARD_REGISTRY_BALANCE in HBAR (max 500. 50 suggested for smoke, 500 for full e2e)
        default: 50

permissions:
  contents: read
  checks: write        # required by publish-unit-test-result-action

concurrency:
  group: e2e-tests-${{ github.event_name }}-${{ github.ref }}
  # Superseded pushes are pointless; a nightly or a hand-triggered run is not.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  buildAndTest:
    name: Build and test
    runs-on: guardian-linux-medium
    timeout-minutes: 60
    env:
      # .yarnrc.yml does not set enableGlobalCache and Yarn 4 defaults it to true,
      # which puts the cache in ~/.yarn/berry/cache. Forcing it off keeps the cache in
      # the project's own .yarn/cache, which is what the "Load Yarn cache" step below
      # restores. Do not remove one without the other.
      YARN_ENABLE_GLOBAL_CACHE: "false"
      # Cypress defaults to ~/.cache/Cypress; pinning it makes the cached path
      # independent of whatever HOME this container happens to have.
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/Cypress
      MIN_PASSWORD_LENGTH: 4
      PASSWORD_COMPLEXITY: easy
      NODE_VERSION: "24.18.1"
      # How many worker-service processes to run; the readiness gate expects exactly
      # this many WORKERS_SERVICE connections on NATS.
      WORKER_COUNT: 5

    services:
      # Redis-compatible cache for api-gateway (HOST_CACHE / PORT_CACHE / ENABLE_CACHE
      # in api-gateway/configs/.env.gateway).
      cache:
        image: valkey/valkey:8.1-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

      # MQ_ADDRESS=localhost in every service config. 8222 is the NATS monitoring
      # endpoint the readiness gate polls; the image's bundled nats-server.conf already
      # sets monitor_port: 8222.
      #
      # NOTE: this runs with the image default max_payload of 1MB, whereas
      # configs/nats.conf (used by docker-compose) sets max_payload: 64MB. Services set
      # MQ_MAX_PAYLOAD=1048576 and offload anything larger through LargePayloadContainer,
      # and the step-security/nats-action setup this replaced also ran with the 1MB
      # default, so this is not a regression -- but it is a real CI/production
      # difference. Mounting configs/nats.conf here is impossible: service containers
      # start before `checkout`, so the file does not exist yet. Production parity would
      # mean moving NATS back to a `docker run` step placed after checkout.
      message-broker:
        image: nats:2.12-alpine
        ports:
          - 127.0.0.1:4222:4222
          - 127.0.0.1:8222:8222
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8222/healthz || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20

      # DB_HOST=localhost in every service config.
      mongo:
        image: mongo:7.0.21
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 30

      # Same Kubo node as docker-compose-quickstart.yml: stock image, default (online)
      # profile, telemetry off. The upstream image ships its own
      # HEALTHCHECK "ipfs diag healthy"; we only shorten the interval.
      #
      # Image tags are literal on purpose: the `env` context is NOT available inside
      # jobs.<id>.services.<id>, so ${{ env.KUBO_VERSION }} would silently expand to an
      # empty string.
      ipfs-node:
        image: ipfs/kubo:v0.43.0
        env:
          IPFS_TELEMETRY: "off"
        ports:
          - 127.0.0.1:4001:4001
          - 127.0.0.1:5001:5001
          - 127.0.0.1:8080:8080
        options: >-
          --init
          --health-interval 5s --health-timeout 5s --health-retries 40

    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Runs before the checkout on purpose: it only reads the event payload and the
      # inputs, so a bad balance fails the run in seconds instead of after the build.
      - name: Resolve run parameters
        id: params
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_TAGS: ${{ inputs.tags }}
          IN_BALANCE: ${{ inputs.sr_balance }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            schedule)          TAGS="all";               BALANCE=500 ;;
            push)              TAGS="smoke";             BALANCE=50  ;;
            workflow_dispatch) TAGS="${IN_TAGS:-smoke}"; BALANCE="${IN_BALANCE:-50}" ;;
            *)                 TAGS="${IN_TAGS:-smoke}"; BALANCE=50  ;;
          esac

          # guardian-service hands this straight to Hedera's AccountCreateTransaction
          # (guardian-service/src/api/demo.service.ts:45) and neither it nor
          # worker-service/src/api/helpers/hedera-sdk-helper.ts:894 imposes a maximum,
          # so the ceiling has to be enforced here or a typo drains the CI operator
          # account.
          if ! [[ "$BALANCE" =~ ^[0-9]+$ ]] || (( BALANCE < 1 || BALANCE > 500 )); then
            echo "::error::INITIAL_STANDARD_REGISTRY_BALANCE must be an integer between 1 and 500 (got '$BALANCE')"
            exit 1
          fi

          {
            echo "tags=$TAGS"
            echo "sr_balance=$BALANCE"
            echo "report_name=Guardian e2e test report - $TAGS - ${GITHUB_SHA:0:8}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Guardian code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # `cache:` is deliberately not set. It accepts a single package manager (so npm
      # and yarn cannot both be enabled), and for Yarn Berry it shells out to
      # `yarn config get cacheFolder`, which needs yarn on PATH -- and with
      # packageManager: yarn@4.16.0 that only happens after `corepack enable`, which has
      # to run *after* this step. The explicit actions/cache steps below cover both.
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Must follow setup-node: enabling corepack against the pre-installed Node and
      # then swapping the Node out leaves the shims pointing at the wrong runtime.
      - name: Enable Corepack
        run: corepack enable

      # This runner is a bare self-hosted container, so it provides none of what the
      # cypress/included image used to. Xvfb is needed even for a headless API run,
      # because `cypress verify` smoke-tests the Electron binary against a display.
      # Package names are Ubuntu 22.04 (jammy); on 24.04+ libasound2 becomes libasound2t64.
      - name: Install Cypress operating system dependencies
        shell: bash
        run: |
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            xvfb xauth \
            libgtk-3-0 libgbm1 libnotify4 \
            libnss3 libnspr4 \
            libxss1 libxtst6 libasound2

      # `**/yarn.lock` also matches lockfiles inside dependencies; the root one is the
      # only input that matters. .yarnrc.yml is in the key because it decides where the
      # cache lives at all (see YARN_ENABLE_GLOBAL_CACHE above).
      - name: Load Yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.NODE_VERSION }}-
            ${{ runner.os }}-yarn-

      - name: Load npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('e2e-tests/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Resolve Cypress version
        id: cypress
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./e2e-tests/package.json').devDependencies.cypress")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Kept separate from the npm cache and keyed on the Cypress version only: the
      # binary is ~200MB and a routine package-lock.json bump should not force a
      # re-download.
      - name: Load Cypress binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CYPRESS_CACHE_FOLDER }}
          key: ${{ runner.os }}-cypress-bin-${{ steps.cypress.outputs.version }}
          restore-keys: ${{ runner.os }}-cypress-bin-

      - name: Install Guardian dependencies
        run: yarn install --immutable

      - name: Install tests dependencies
        working-directory: e2e-tests
        run: npm ci --prefer-offline --no-audit --fund=false

      # --topological-dev derives the order from the workspace dependency graph
      # (@guardian/interfaces -> @guardian/common -> the services), so the independent
      # services build concurrently. --jobs 4 rather than unlimited keeps tsc's memory
      # use in check on this runner.
      - name: Build Guardian packages
        env:
          CI: true
          NODE_OPTIONS: "--openssl-legacy-provider"
        run: |
          yarn workspaces foreach -A --topological-dev --parallel --jobs 4 \
            --include '@guardian/interfaces' \
            --include '@guardian/common' \
            --include 'notification-service' \
            --include 'logger-service' \
            --include 'auth-service' \
            --include 'queue-service' \
            --include 'topic-listener-service' \
            --include 'guardian-service' \
            --include 'policy-service' \
            --include 'worker-service' \
            --include 'api-gateway' \
            run build

      # The service containers have their own --health-cmd, but those run *inside* the
      # container and so prove nothing about the host port mapping. These probes are
      # from the runner's point of view, which is how the Guardian services will reach
      # them (every config uses localhost).
      - name: Verify infrastructure
        shell: bash
        run: |
          set -euo pipefail

          wait_tcp() {
            local host=$1 port=$2 name=$3
            echo "Waiting for $name on $host:$port ..."
            timeout 120 bash -c "until (exec 3<>/dev/tcp/$host/$port) 2>/dev/null; do sleep 2; done" \
              || { echo "::error::$name is not reachable on $host:$port"; exit 1; }
          }

          wait_tcp 127.0.0.1 4222  "NATS"
          wait_tcp 127.0.0.1 27017 "MongoDB"
          wait_tcp 127.0.0.1 6379  "Valkey"

          echo "Checking the NATS monitoring endpoint on :8222 ..."
          timeout 120 bash -c 'until curl -fsS --max-time 5 http://127.0.0.1:8222/varz >/dev/null; do sleep 2; done' \
            || { echo "::error::NATS monitoring endpoint (:8222) is not answering; the readiness gate needs it"; exit 1; }

          echo "Checking the IPFS RPC API on :5001 ..."
          timeout 180 bash -c 'until curl -fsS --max-time 5 -X POST http://127.0.0.1:5001/api/v0/id >/dev/null; do sleep 2; done' \
            || { echo "::error::IPFS RPC API (:5001) is not answering"; exit 1; }
          curl -fsS --max-time 5 -X POST http://127.0.0.1:5001/api/v0/id

          # worker-service reads through the gateway, so it has to be up too.
          # bafkqaaa is the empty block, served without touching the network.
          echo "Checking the IPFS gateway on :8080 ..."
          timeout 180 bash -c 'until curl -fsS --max-time 5 http://127.0.0.1:8080/ipfs/bafkqaaa >/dev/null; do sleep 2; done' \
            || { echo "::error::IPFS gateway (:8080) is not answering"; exit 1; }

      # No `sleep` anywhere: each tier waits until its services have actually opened
      # their named NATS connection, and every process gets its own log file so a boot
      # failure is diagnosable after the fact.
      - name: Start Guardian
        shell: bash
        env:
          # `runner` is not available in the job-level env, so the log dir is declared
          # on each step that needs it (Start Guardian, the readiness gate, Redact).
          GUARDIAN_LOG_DIR: ${{ runner.temp }}/guardian-logs
          CI: true
          NODE_OPTIONS: "--openssl-legacy-provider"
          OPERATOR_ID: ${{ secrets.CI_HEDERA_ACCOUNT }}
          OPERATOR_KEY: ${{ secrets.CI_HEDERA_PRIV_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.CI_JWT_PUBLIC_KEY }}
          SERVICE_JWT_PUBLIC_KEY_ALL: ${{ secrets.CI_JWT_PUBLIC_KEY }}
          SERVICE_JWT_SECRET_KEY_ALL: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          IPFS_PROVIDER: local
          IPFS_NODE_ADDRESS: http://127.0.0.1:5001
          IPFS_PUBLIC_GATEWAY: http://127.0.0.1:8080/ipfs/{cid}
          IPFS_TIMEOUT: 720
          ACCESS_TOKEN_UPDATE_INTERVAL: 600000
          INITIAL_BALANCE: 20
          INITIAL_STANDARD_REGISTRY_BALANCE: ${{ steps.params.outputs.sr_balance }}
        run: |
          set -euo pipefail
          mkdir -p "$GUARDIAN_LOG_DIR"
          : > "$GUARDIAN_LOG_DIR/pids"

          start() {                       # start <service> [instance]
            local svc=$1 idx=${2:-1}
            (cd "$svc" && exec npm start) > "$GUARDIAN_LOG_DIR/$svc-$idx.log" 2>&1 &
            echo "$! $svc#$idx" >> "$GUARDIAN_LOG_DIR/pids"
            echo "started $svc#$idx (pid $!)"
          }

          wait_nats() {
            node "$GITHUB_WORKSPACE/.github/scripts/wait-for-guardian.mjs" nats "$@"
          }

          start logger-service
          start notification-service
          wait_nats LOGGER_SERVICE NOTIFICATION_SERVICE

          start auth-service
          start queue-service
          wait_nats AUTH_SERVICE QUEUE_SERVICE

          start policy-service
          start topic-listener-service
          for i in $(seq 1 "$WORKER_COUNT"); do start worker-service "$i"; done
          wait_nats policy-service LISTENER_SERVICE WORKERS_SERVICE

          start guardian-service
          wait_nats GUARDIANS_SERVICE

          start api-gateway
          wait_nats API_GATEWAY

      # Replaces the old `sleep 15   # grace for backend NATS subscriptions`.
      - name: Wait for Guardian to be ready
        env:
          GUARDIAN_LOG_DIR: ${{ runner.temp }}/guardian-logs
        run: node .github/scripts/wait-for-guardian.mjs ready

      - name: Run Cypress Tests
        working-directory: e2e-tests
        timeout-minutes: 180
        run: ./entrypoint.sh
        env:
          CYPRESS_portApi: 3002
          CYPRESS_BROWSER: electron
          # /dev/shm is 64 MB in this container, well under what Chromium expects
          ELECTRON_EXTRA_LAUNCH_ARGS: --disable-dev-shm-usage
          CYPRESS_operatorId: ${{ secrets.CI_HEDERA_ACCOUNT }}
          CYPRESS_operatorKey: ${{ secrets.CI_HEDERA_PRIV_KEY }}
          CYPRESS_ipfsStorageApiKey: ${{ secrets.IPFS_STORAGE_API_KEY }}
          CYPRESS_MGSAdmin: ${{ secrets.MGS_TENANT_NAME }}
          CYPRESS_MGSIndexerAPIToken: ${{ secrets.MGSIndexerAPIToken }}
          CYPRESS_grepTags: ${{ steps.params.outputs.tags }}
          CYPRESS_grepFilterSpecs: true
          ReportName: ${{ steps.params.outputs.report_name }}
          CYPRESS_minPasswordLength: ${{ env.MIN_PASSWORD_LENGTH }}
          CYPRESS_passwordComplexity: ${{ env.PASSWORD_COMPLEXITY }}

      # Cypress writes straight into the workspace now, so there is nothing to copy
      # out; just make sure the steps below always find the directories.
      - name: Ensure test result directories exist
        if: always()
        run: |
          mkdir -p e2e-tests/cypress/test_results e2e-tests/cypress/reports \
                   e2e-tests/cypress/screenshots e2e-tests/cypress/videos \
                   e2e-tests/cypress/downloads

      # Must run before every consumer below. A failing cy.request has its whole
      # request -- `authorization: Bearer <JWT>` included -- written into the JUnit XML,
      # the mochawesome JSONs and the merged HTML report. GitHub only masks values that
      # came from `secrets.*`, and these tokens are minted at runtime.
      - name: Redact secrets from test artifacts
        if: always()
        env:
          GUARDIAN_LOG_DIR: ${{ runner.temp }}/guardian-logs
        run: |
          set -euo pipefail
          node .github/scripts/redact.mjs \
            e2e-tests/cypress/test_results \
            e2e-tests/cypress/reports \
            "$GUARDIAN_LOG_DIR"
          node .github/scripts/redact.mjs --check \
            e2e-tests/cypress/test_results \
            e2e-tests/cypress/reports \
            "$GUARDIAN_LOG_DIR"

      - name: Print test results
        uses: step-security/publish-unit-test-result-action@681100d67b09305624c089873f12c545ee7cbc24 # v2.23.0
        if: always()
        with:
          files: e2e-tests/cypress/test_results/**/*.xml
          check_name: Test results
          report_individual_runs: true
          comment_mode: 'off'

      - name: Print test details
        if: always()
        working-directory: e2e-tests
        env:
          CYPRESS_grepTags: ${{ steps.params.outputs.tags }}
        run: node scripts/report-summary.mjs

      - name: Print run configuration
        shell: bash
        env:
          TAGS: ${{ steps.params.outputs.tags }}
          SR_BALANCE: ${{ steps.params.outputs.sr_balance }}
          REPORT_NAME: ${{ steps.params.outputs.report_name }}
          INITIAL_BALANCE: 20
          IPFS_TIMEOUT: 720
          ACCESS_TOKEN_UPDATE_INTERVAL: 600000
          # Everything below goes through env rather than being interpolated into the
          # script: a branch named `$(...)` would otherwise be command-substituted
          # inside the double-quoted echoes.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUNNER_LABEL: ${{ runner.name }}
          RUNNER_PLATFORM: ${{ runner.os }}/${{ runner.arch }}
        if: always()
        run: |
          set -euo pipefail
          # Only non-secret job parameters are printed here. OPERATOR_*, JWT_*,
          # SERVICE_JWT_*, MGS* and IPFS_STORAGE_API_KEY stay confined to the `env:` of
          # the individual steps that need them.
          {
            echo "## Workflow run configuration"
            echo
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Report name | \`${REPORT_NAME}\` |"
            echo "| Trigger | \`${EVENT_NAME}\` |"
            echo "| Ref | \`${REF_NAME}\` |"
            echo "| Commit | \`${COMMIT_SHA}\` |"
            echo "| CYPRESS_grepTags | \`${TAGS}\` |"
            echo "| INITIAL_STANDARD_REGISTRY_BALANCE | \`${SR_BALANCE}\` |"
            echo "| INITIAL_BALANCE | \`${INITIAL_BALANCE}\` |"
            echo "| MIN_PASSWORD_LENGTH | \`${MIN_PASSWORD_LENGTH}\` |"
            echo "| PASSWORD_COMPLEXITY | \`${PASSWORD_COMPLEXITY}\` |"
            echo "| NODE_VERSION | \`${NODE_VERSION}\` |"
            echo "| WORKER_COUNT | \`${WORKER_COUNT}\` |"
            echo "| IPFS_PROVIDER | \`local\` |"
            echo "| IPFS_TIMEOUT | \`${IPFS_TIMEOUT}\` |"
            echo "| ACCESS_TOKEN_UPDATE_INTERVAL | \`${ACCESS_TOKEN_UPDATE_INTERVAL}\` |"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload tests results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cypress-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-tests/cypress/reports/
            e2e-tests/cypress/test_results/
            e2e-tests/cypress/downloads/
          include-hidden-files: true
          retention-days: 30

      # API runs disable video and screenshots (cypress.config.js sets video: false and
      # entrypoint.sh sets CYPRESS_screenshotOnRunFailure=false), so these are only
      # worth uploading when something actually broke.
      - name: Upload failure screenshots and videos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-tests/cypress/screenshots/
            e2e-tests/cypress/videos/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Guardian service logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: guardian-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guardian-logs/
          if-no-files-found: ignore
          retention-days: 14
