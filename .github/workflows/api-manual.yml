name: Guardian CI API Tests (Manual)
run-name: Guardian CI API Tests (Manual) - ${{ inputs.tags }}
on:
  workflow_dispatch:
    inputs:
      tags:
        type: string
        description: Tags for API tests scope(s) (smoke, accounts, policies, etc.)
        default: "all"
      report_name:
        type: string
        description: Cypress Report name
        default: "Guardian's Cypress Report"
jobs:
  buildAndTest:
    name: Build and Test (Manual)
    runs-on: guardian-linux-medium
    env:
      YARN_ENABLE_GLOBAL_CACHE: "false"
      MIN_PASSWORD_LENGTH: 4
      PASSWORD_COMPLEXITY: easy
      NODE_VERSION: "24.18.1"
      MONGODB_VERSION: "7.0.21"
      KUBO_VERSION: "0.43.0"
    services:
      cache:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: |
          pushd interfaces
          yarn run build
          popd
          pushd common
          yarn run build
          popd
          pushd notification-service
          yarn run build
          popd
          pushd logger-service
          yarn run build
          popd
          pushd auth-service
          yarn run build
          popd
          pushd queue-service
          yarn run build
          popd
          pushd topic-listener-service
          yarn run build
          popd
          pushd guardian-service
          yarn run build
          popd
          pushd policy-service
          yarn run build
          popd
          pushd worker-service
          yarn run build
          popd
          pushd api-gateway
          yarn run build
          popd

      - name: Start NatsMQ
        uses: step-security/nats-action@2254b4cc4958120e36da3a096e8200dac968be1c # v0.1.4
        with:
          port: "4222"

      - name: Start IPFS node
        shell: bash
        run: |
          # Same Kubo node as docker-compose-quickstart.yml: stock image, default (online)
          # profile, telemetry off, RPC/gateway/swarm published on the loopback interface.
          docker run -d --name ipfs-node --init \
            -e IPFS_TELEMETRY=off \
            -p 127.0.0.1:4001:4001 \
            -p 127.0.0.1:5001:5001 \
            -p 127.0.0.1:8080:8080 \
            ipfs/kubo:v${{ env.KUBO_VERSION }}

          echo "Waiting for the IPFS RPC API on :5001..."
          timeout 180 bash -c 'until curl -fsS -X POST http://127.0.0.1:5001/api/v0/id >/dev/null 2>&1; do sleep 2; done' \
            || { docker logs ipfs-node; exit 1; }
          curl -fsS -X POST http://127.0.0.1:5001/api/v0/id

          # the gateway is what worker-service reads through, so wait for it too
          # (bafkqaaa is the empty block, served without touching the network)
          echo "Waiting for the IPFS gateway on :8080..."
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:8080/ipfs/bafkqaaa >/dev/null 2>&1; do sleep 2; done' \
            || { docker logs ipfs-node; exit 1; }

      - name: Start MongoDB
        uses: step-security/mongodb-github-action@7bbfdaf9f5b4e8b4ffbe2905fd9e4756d3204ed6
        with:
          mongodb-version: ${{ env.MONGODB_VERSION }}

      - name: Run Guardian
        run: |
          start() { for s in "$@"; do (cd "$s" && npm start) & done; }

          start logger-service notification-service
          sleep 5
          start auth-service queue-service
          sleep 5
          start policy-service topic-listener-service
          for _ in {1..5}; do (cd worker-service && npm start) & done
          sleep 5
          start guardian-service
          sleep 5
          start api-gateway

          echo "Waiting for API gateway on :3002..."
          timeout 180 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/3002) 2>/dev/null; do sleep 2; done'
          sleep 15   # grace for backend NATS subscriptions
        env:
          CI: true
          NODE_OPTIONS: "--openssl-legacy-provider"
          OPERATOR_ID: ${{ secrets.CI_HEDERA_ACCOUNT }}
          OPERATOR_KEY: ${{ secrets.CI_HEDERA_PRIV_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.CI_JWT_PUBLIC_KEY }}
          SERVICE_JWT_PUBLIC_KEY_ALL: ${{ secrets.CI_JWT_PUBLIC_KEY }}
          SERVICE_JWT_SECRET_KEY_ALL: ${{ secrets.CI_JWT_PRIVATE_KEY }}
          IPFS_PROVIDER: local
          IPFS_NODE_ADDRESS: http://127.0.0.1:5001
          IPFS_PUBLIC_GATEWAY: http://127.0.0.1:8080/ipfs/{cid}
          IPFS_TIMEOUT: 720
          ACCESS_TOKEN_UPDATE_INTERVAL: 600000
          INITIAL_BALANCE: 20
          INITIAL_STANDARD_REGISTRY_BALANCE: 250

      # The API suites are pure cy.request calls (no cy.visit anywhere under
      # cypress/e2e/api-tests), so they need no browser and no container: Cypress
      # runs straight on the runner with its bundled Electron. Only the binary and
      # the npm downloads are cached, which is a fraction of the cypress/included image.
      - name: Cache Cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/Cypress
            ~/.npm
          key: ${{ runner.os }}-cypress-${{ hashFiles('e2e-tests/package-lock.json') }}
          restore-keys: ${{ runner.os }}-cypress-

      # This runner is a bare self-hosted container (see "Show runner properties":
      # every library below reports MISSING), so it provides none of what the
      # cypress/included image used to. Xvfb is needed even for a headless API run,
      # because `cypress verify` smoke-tests the Electron binary against a display.
      # Package names are Ubuntu 22.04 (jammy); on 24.04+ libasound2 becomes libasound2t64.
      - name: Install Cypress system dependencies
        shell: bash
        run: |
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            xvfb xauth \
            libgtk-3-0 libgbm1 libnotify4 \
            libnss3 libnspr4 \
            libxss1 libxtst6 libasound2

      - name: Install Cypress dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Run Cypress API Tests
        working-directory: e2e-tests
        run: ./entrypoint.sh
        env:
          CYPRESS_portApi: 3002
          CYPRESS_BROWSER: electron
          # /dev/shm is 64 MB in this container, well under what Chromium expects
          ELECTRON_EXTRA_LAUNCH_ARGS: --disable-dev-shm-usage
          CYPRESS_operatorId: ${{ secrets.CI_HEDERA_ACCOUNT }}
          CYPRESS_operatorKey: ${{ secrets.CI_HEDERA_PRIV_KEY }}
          CYPRESS_ipfsStorageApiKey: ${{ secrets.IPFS_STORAGE_API_KEY }}
          CYPRESS_MGSAdmin: ${{ secrets.MGS_TENANT_NAME }}
          CYPRESS_MGSIndexerAPIToken: ${{ secrets.MGSIndexerAPIToken }}
          CYPRESS_grepTags: ${{ inputs.tags }}
          CYPRESS_grepFilterSpecs: true
          ReportName: ${{ inputs.report_name }}
          CYPRESS_minPasswordLength: ${{ env.MIN_PASSWORD_LENGTH }}
          CYPRESS_passwordComplexity: ${{ env.PASSWORD_COMPLEXITY }}

      # Cypress writes straight into the workspace now, so there is nothing to copy
      # out; just make sure the upload steps below always find the directories.
      - name: Ensure test result directories exist
        if: always()
        run: |
          mkdir -p e2e-tests/cypress/test_results e2e-tests/cypress/reports e2e-tests/cypress/screenshots e2e-tests/cypress/videos e2e-tests/cypress/downloads
          find e2e-tests/cypress/reports -type f 2>/dev/null || true

      - name: Publish API Test Results
        uses: step-security/publish-unit-test-result-action@681100d67b09305624c089873f12c545ee7cbc24 # v2.23.0
        if: always()
        with:
          files: e2e-tests/cypress/test_results/**/*.xml

      - name: Upload tests results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cypress-reports
          path: |
            e2e-tests/cypress/reports/
            e2e-tests/cypress/screenshots/
            e2e-tests/cypress/videos/
            e2e-tests/cypress/downloads/
          include-hidden-files: true
          retention-days: 7
