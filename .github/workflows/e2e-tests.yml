name: E2E Tests
run-name: E2E Tests · ${{ github.event_name == 'schedule' && 'api-all policy-all' || (inputs.tags || 'smoke') }}
on:
  push:
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '0 3 * * *' # Run at 03:00 UTC every day (nightly)
  workflow_dispatch:
    inputs:
      tags:
        type: string
        description: Tags for test scope(s) (smoke, accounts, policies, api-all, policy-all, ui-all, all, ...)
        default: "smoke"
      solo_version:
        type: string
        description: Solo release that deploys the local Hiero network (empty uses the workflow default)
        default: ""

permissions:
  contents: read
  checks: write        # required by publish-unit-test-result-action

concurrency:
  group: e2e-tests-${{ github.event_name }}-${{ github.ref }}
  # Superseded pushes are pointless; a nightly or a hand-triggered run is not.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  api:
    name: API tests
    uses: ./.github/workflows/e2e-run.yml
    secrets: inherit
    with:
      suite: api
      grep_tags: ${{ github.event_name == 'schedule' && 'api-all policy-all' || inputs.tags || 'smoke' }}
      solo_version: ${{ inputs.solo_version }}
