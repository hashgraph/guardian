name: E2E Tests
run-name: E2E Tests · ${{ github.event_name == 'schedule' && 'all' || (inputs.tags || 'smoke') }}
on:
  push:
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '0 3 * * *' # Run at 03:00 UTC every day (nightly)
  workflow_dispatch:
    inputs:
      tags:
        type: string
        description: Tags for the test scope (smoke, all, api-all, policy-all, ...). Separate several with spaces
        default: "smoke"
      spec:
        type: string
        description: Optional spec glob to narrow the run, e.g. cypress/e2e/api-tests/001_demo/*.cy.js
        default: ""
      solo_version:
        type: string
        description: Solo release that deploys the local Hiero network (empty uses the workflow default)
        default: ""
      ui_request_trace:
        type: boolean
        description: Log every request the frontend proxies to the gateway (frontend-1.log in the guardian-logs artifact; large). Only has an effect when the tags select UI tests
        default: false

permissions:
  contents: read
  checks: write        # required by publish-unit-test-result-action

concurrency:
  group: e2e-tests-${{ github.event_name }}-${{ github.ref }}
  # Superseded pushes are pointless; a nightly or a hand-triggered run is not.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  e2e:
    name: E2E tests
    uses: ./.github/workflows/e2e-run.yml
    secrets: inherit
    with:
      suite: e2e
      grep_tags: ${{ github.event_name == 'schedule' && 'all' || inputs.tags || 'smoke' }}
      spec: ${{ inputs.spec }}
      solo_version: ${{ inputs.solo_version }}
      ui_request_trace: ${{ inputs.ui_request_trace || false }}
