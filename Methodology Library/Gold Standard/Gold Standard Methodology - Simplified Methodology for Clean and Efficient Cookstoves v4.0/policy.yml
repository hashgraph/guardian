description: >
  Guardian implementation of Gold Standard's Simplified Methodology for Clean and Efficient Cookstoves (SMEC) v4.0. Quantifies emission reductions from micro-scale clean cookstove projects using deemed additionality and default baselines combined with direct field-based performance measurement (biennial Project Kitchen Performance Tests), aligned to the Paris Agreement.
