id: gold-standard-smec-v4
name: Gold Standard SMEC v4.0 - Simplified Methodology for Clean and Efficient Cookstoves
version: "1.0.0"
description: >
  Guardian implementation of Gold Standard SMEC v4.0 (GS4GG, PAA M400-07), the
  Simplified Methodology for Clean and Efficient Cookstoves: baseline and project
  emission calculations (Eq. 1-18) with Options A/B baseline fuel accounting,
  the 90/10 precision rule, consumption caps, leakage and Hawthorne adjustment,
  plus end-user notification, IAP assessment, and usage-survey monitoring workflows.
