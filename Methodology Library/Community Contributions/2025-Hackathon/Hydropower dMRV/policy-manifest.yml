id: hackathon-2026-vmr0017-hydropower-dmrv
name: VMR0017 / ACM0002 Grid-Connected Renewable Energy dMRV
version: "1.0.0"
description: >
  Hedera Guardian dMRV policy digitizing Verra VMR0017 v1.0 (applied to
  CDM ACM0002 v22.0) for grid-connected electricity generation from renewable
  sources, with a hydropower focus. Implements the full crediting workflow —
  project description, monitoring reports, multi-role verification, an automated
  emission-reduction calculation engine, and on-chain VCU minting.
