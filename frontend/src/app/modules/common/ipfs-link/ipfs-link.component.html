@if (url) {
    <div class="sf-ro-file-links">
        <a class="sf-ro-open" [href]="link" target="_blank" rel="noopener noreferrer">
            <i class="pi pi-external-link" aria-hidden="true"></i>
            Open
        </a>
        <sf-copy [value]="url" tip="Copy link"></sf-copy>
        <sf-copy [value]="cid" [disabled]="!cid" tip="Copy CID" label="CID"></sf-copy>
    </div>
}
