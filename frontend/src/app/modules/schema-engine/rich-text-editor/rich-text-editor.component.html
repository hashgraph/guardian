<div class="rte-wrapper" [class.rte-readonly]="readonly || isDisabled">
  @if (!readonly && !isDisabled) {
    <div class="rte-toolbar" role="toolbar" aria-label="Text formatting">
      @for (item of toolbarItems; track $index) {
        @if (item.separator) {
          <span class="rte-separator"></span>
        } @else {
          <button
            type="button"
            class="rte-btn"
            [title]="commandTitle(item.command, item.title!)"
            [disabled]="isCommandDisabled(item.command)"
            (mousedown)="execCommand(item.command!, $event)"
            tabindex="-1"
          >
            @if (item.icon) {
              <i [class]="item.icon"></i>
            } @else {
              <span class="rte-label" [class.rte-label-bold]="item.command === 'bold'" [class.rte-label-italic]="item.command === 'italic'" [class.rte-label-underline]="item.command === 'underline'">{{ item.label }}</span>
            }
          </button>
        }
      }
    </div>
  }
  <div
    #editor
    class="rte-editor"
    [class.rte-empty]="isEmpty"
    [attr.contenteditable]="(readonly || isDisabled) ? false : true"
    [attr.data-placeholder]="placeholder"
    (input)="onInput()"
    (paste)="onPaste($event)"
    (dragstart)="onDragStart()"
    (dragend)="onDragEnd()"
    (dragover)="onDragOver($event)"
    (drop)="onDrop($event)"
    (click)="onEditorClick($event)"
    (blur)="onBlur()"
    role="textbox"
    aria-multiline="true"
  ></div>
  @if (showLinkDialog) {
    <div class="rte-link-dialog" [style.left.px]="linkDialogPosition.left" [style.top.px]="linkDialogPosition.top" role="dialog" aria-label="Insert or edit hyperlink">
      <div class="rte-link-dialog-content">
        <div class="rte-link-dialog-title">{{ isEditingLink ? 'Edit link' : 'Insert link' }}</div>
        <label class="rte-link-label" for="rte-link-url">URL</label>
        <input
          id="rte-link-url"
          #linkInput
          class="rte-link-input"
          type="url"
          [(ngModel)]="linkUrl"
          placeholder="https://example.com"
          (keydown.enter)="insertLink()"
          (keydown.escape)="cancelLink()"
        />
        <div class="rte-link-actions">
          @if (isEditingLink) {
            <button type="button" class="rte-link-remove" (click)="removeLink()">Remove</button>
          }
          <button type="button" class="rte-link-cancel" (click)="cancelLink()">Cancel</button>
          <button type="button" class="rte-link-submit" (click)="insertLink()">{{ isEditingLink ? 'Update' : 'Insert' }}</button>
        </div>
      </div>
    </div>
  }
</div>
