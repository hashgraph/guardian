<div class="content" [hidden]="!isActive" [attr.readonly-block]="readonly">
  @if (type == 'loader') {
    <div class="info-loader">
      <div class="preloader-image preloader-image-l-size"></div>
    </div>
  }
  @if (type == 'text') {
    <div class="pv-state pv-state--wait">
      <div class="pv-state__icon"><i class="pi pi-clock" aria-hidden="true"></i></div>
      <div class="pv-state__title">{{ title }}</div>
      @if (description && description !== title) {
        <div class="pv-state__text">{{ description }}</div>
      }
    </div>
  }
</div>

<ng-template #preloader>
  <div class="preloader-image"></div>
</ng-template>

@if (loading) {
  <div class="loading">
    <div class="preloader-image preloader-image-l-size"></div>
  </div>
}
