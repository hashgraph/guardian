@if (commonVisible) {
  <div class="content" [attr.readonly-block]="readonly">
    @for (button of buttons; track button) {
      @if ((button.type === 'selector' || button.type === 'selector-dialog') && button.visible && button.name && isBtnVisible(button)) {
        <div>
          <button type="button" class="btn-option {{button.uiClass}}" (click)="button.type === 'selector-dialog' ? onSelectDialog(button) : onSelect(button)">
            @if (button.uiClass == 'btn-approve') {
              <i class="pi pi-check" aria-hidden="true"></i>
            }
            @if (button.uiClass == 'btn-reject') {
              <i class="pi pi-times" aria-hidden="true"></i>
            }
            {{button.name}}
          </button>
        </div>
      }
    }
  </div>
}

<ng-template #preloader>
  <div class="preloader-image"></div>
</ng-template>

@if (loading) {
  <div class="loading">
    <div class="preloader-image preloader-image-l-size"></div>
  </div>
}
