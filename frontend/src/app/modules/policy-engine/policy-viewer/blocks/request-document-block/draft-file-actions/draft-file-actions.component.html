<button
    (click)="onExportDraft()"
    class="draft-action"
    type="button"
>
    <svg-icon
        class="svg-icon-16"
        src="/assets/images/icons/export-file.svg"
        svgClass="icon-color-primary"
    ></svg-icon>
    <span>Save Draft To File</span>
</button>
<button
    (click)="triggerImportDraft()"
    class="draft-action"
    type="button"
>
    <svg-icon
        class="svg-icon-16"
        src="/assets/images/icons/import-file.svg"
        svgClass="icon-color-primary"
    ></svg-icon>
    <span>Restore From Draft File</span>
</button>
<input
    #draftFileInput
    type="file"
    accept="application/json,.json"
    hidden
    (change)="onImportDraft($event)">
