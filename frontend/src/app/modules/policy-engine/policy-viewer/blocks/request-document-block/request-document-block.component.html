<div [hidden]="!isExist" class="content-{{ type }}" [attr.readonly-block]="readonly">
  @if (type == 'dialog') {
    @if (isBtnVisible()) {
      <div class="create-button-container">
        <p-button (click)="onDialogOpen()" class="btn-block-{{ buttonClass }}">
          {{ content }}
        </p-button>
      </div>
    }
  }
  @if (type == 'page') {
    @if (schema) {
      <div class="pv-card launch-card">
        <div class="launch-card-text">
          @if (title) {
            <h3 class="launch-card-title">{{ title }}</h3>
          }
          @if (description) {
            <div class="launch-card-description">{{ description }}</div>
          }
        </div>
        <div class="pv-card-actions">
          <button type="button" class="guardian-button guardian-button-primary" (click)="onDialogOpen()">Start</button>
        </div>
      </div>
    }
  }
</div>

<ng-template #preloader>
  <div class="preloader-image"></div>
</ng-template>

@if (loading) {
  <div class="loading">
    <div class="preloader-image preloader-image-l-size"></div>
  </div>
}
