<div [hidden]="!isExist" class="content-{{ type }}" [attr.readonly-block]="readonly">
  @if (type == 'dialog') {
    @if (isBtnVisible()) {
      <div class="create-button-container">
        <p-button (click)="onDialogOpen()" class="btn-block-{{ buttonClass }}">
          {{ content }}
        </p-button>
      </div>
    }
  }
  @if (type == 'page') {
    @if (schema) {
      <div class="pv-card pv-state pv-state--info">
        <div class="pv-state__icon"><i class="pi pi-file" aria-hidden="true"></i></div>
        <div class="pv-state__title">{{ title || 'Complete the form' }}</div>
        <div class="pv-state__text">{{ description || 'Fill in the required details and submit them to continue.' }}</div>
        <div class="pv-state__actions">
          <button type="button" class="pv-state-button" [disabled]="disabled" (click)="onDialogOpen()">Start</button>
        </div>
      </div>
    }
  }
</div>

<ng-template #preloader>
  <div class="preloader-image"></div>
</ng-template>

@if (loading) {
  <div class="loading">
    <div class="preloader-image preloader-image-l-size"></div>
  </div>
}
