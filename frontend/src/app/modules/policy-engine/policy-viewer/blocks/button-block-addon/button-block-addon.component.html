@if (isBtnVisible()) {
  <div class="content" [style.visibility]="visible ? 'visible' : 'hidden' " [attr.readonly-block]="readonly">
    <button type="button" class="btn-option {{uiClass}}" (click)="dialog ? onSelectDialog() : onSelect()">
      @if (uiClass == 'btn-approve') {
        <i class="pi pi-check" aria-hidden="true"></i>
      }
      @if (uiClass == 'btn-reject') {
        <i class="pi pi-times" aria-hidden="true"></i>
      }
      {{name}}
    </button>
  </div>
}

<ng-template #preloader>
  <div class="preloader-image"></div>
</ng-template>

@if (loading) {
  <div class="loading">
    <div class="preloader-image preloader-image-l-size"></div>
  </div>
}
