<div class="dialog-header">
  <div class="header-container">
    <div class="header-text">Invite link</div>
    @if (policy?.name) {
      <div class="header-item">{{policy.name}}</div>
    }
  </div>
  <div class="header-icon" (click)="onClose()">
    <svg-icon src="/assets/images/icons/close.svg" svgClass="icon-color-close"></svg-icon>
  </div>
</div>
<div class="dialog-body">
  <div class="context">
    <div class="guardian-input-container">
      <label class="form-label">Invite link</label>
      <div class="guardian-input-readonly invite-link">{{invite}}</div>
    </div>
    <div class="qr-container">
      <qrcode [qrdata]="invite" [width]="200" [errorCorrectionLevel]="'M'"></qrcode>
    </div>
  </div>
</div>
<div class="dialog-footer">
  <div class="action-buttons">
    <div class="dialog-button">
      <button
        (click)="onClose()"
      class="guardian-button guardian-button-secondary">Close</button>
    </div>
    <div class="dialog-button">
      <button
        (click)="onCopy()"
      class="guardian-button guardian-button-primary">Copy invite link</button>
    </div>
  </div>
</div>
