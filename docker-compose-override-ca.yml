
# Defining CA_CERTIFICATES_BUNDLE is mandatory if you want to use this override.
# Example:
#
# CA_CERTIFICATES_BUNDLE=~/zscaler-combined-ca.pem docker compose -f docker-compose-quickstart.yml -f docker-compose-override-ca.yml up -d 
services:
  ipfs-node:
    volumes:
      # Inject a complete root bundle directly over the container's default store
      - ${CA_CERTIFICATES_BUNDLE}:/etc/ssl/certs/ca-certificates.crt:ro
