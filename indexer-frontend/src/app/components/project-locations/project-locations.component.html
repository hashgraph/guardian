<div class="map-container">
    <div class="map" id="map"></div>
    <div *ngIf="clusterDocumentIds.length > 1" class="document-picker">
        <div class="document-picker-header">
            <span>Choose a document</span>
            <button type="button" class="document-picker-close" aria-label="Close" (click)="closeDocumentPicker()">×</button>
        </div>
        <button type="button" class="document-picker-item" *ngFor="let projectId of clusterDocumentIds" (click)="openDocument(projectId)">
            {{ projectId }}
        </button>
    </div>
</div>
