# dclint disable require-project-name-field
# This file is linted and formatted using Docker Compose Linter (https://github.com/zavoloklom/docker-compose-linter):
# npx dclint . --fix=true
#
# This is an override meant to be combined with another compose file via `-f`, not run standalone.
#
services:
  web-proxy:
    volumes:
      - ./certs:/certs:ro
      - ./web-proxy/configs/https-default.conf:/etc/nginx/templates/default.conf.template:ro
    ports: !override
      - '127.0.0.1:443:443'
