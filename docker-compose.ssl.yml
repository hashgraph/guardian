# dclint disable require-project-name-field
# This is an SSL overlay meant to be combined with another compose file via `-f`, not run standalone.
services:
  web-proxy:
    volumes:
      - ./certs:/certs:ro
      - ./web-proxy/configs/https-default.conf:/etc/nginx/templates/default.conf.template:ro
    ports: !override
      - '127.0.0.1:443:443'
